name: Update mint directory

on:
  schedule:
    - cron: '0 */6 * * *'  # every 6 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/manual_mints.txt'  # pick up newly approved mint submissions right away
      - 'data/sources.json'      # re-run when the discovery source list changes

concurrency:
  group: update-mints
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install NIP-87 client dependency
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Discover, probe and regenerate mints.json
        run: python scripts/update_mints.py --report "$GITHUB_STEP_SUMMARY"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/mints.json data/candidates.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "auto: update mint directory [skip ci]"
            git push origin main
          fi

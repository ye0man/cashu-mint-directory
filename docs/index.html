<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cashu Mint Directory</title>
  <link href="https://unpkg.com/tabulator-tables@5.5.0/dist/css/tabulator.min.css" rel="stylesheet" />
  <script src="https://unpkg.com/tabulator-tables@5.5.0/dist/js/tabulator.min.js"></script>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #1b1e25;
      --surface: #181a21;
      --text: #f0f2f7;
      --muted: #9aa4b5;
      --accent: #ffae00;
      --border: #2e323d;
      --link: #7ac8ff;
      --header-text: #101218;
      --header-bg: #d4d8e3;
      --hover-bg: #22262f;
      --even-row: #161922;
      --odd-row: #0f1115;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    header {
      padding: 1.5rem 1rem;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
      justify-content: space-between;
    }

    h1 {
      font-size: 1.35rem;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .logo {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--accent);
      display: inline-block;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.85rem;
      margin: 0.25rem 0 0 2.25rem;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .filters {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      flex-wrap: wrap;
      padding: 0.75rem 1rem;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      min-width: 10rem;
    }

    .filter-group label {
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .multi-select {
      position: relative;
      min-width: 12rem;
      max-width: 18rem;
    }

    .multi-select-trigger {
      width: 100%;
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .multi-select-trigger::after {
      content: "▼";
      font-size: 0.65rem;
      color: var(--muted);
    }

    .multi-select.open .multi-select-trigger::after {
      content: "▲";
    }

    .multi-select-dropdown {
      position: absolute;
      top: calc(100% + 0.35rem);
      left: 0;
      z-index: 100;
      min-width: 100%;
      max-height: 18rem;
      overflow-y: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 0.4rem;
      padding: 0.4rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      display: none;
    }

    .multi-select.open .multi-select-dropdown {
      display: block;
    }

    .multi-select-option {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.5rem;
      border-radius: 0.3rem;
      cursor: pointer;
      font-size: 0.9rem;
      white-space: nowrap;
    }

    .multi-select-option:hover {
      background: var(--hover-bg);
    }

    .multi-select-option input[type="checkbox"] {
      flex-shrink: 0;
    }

    .selected-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-top: 0.35rem;
      min-height: 1.4rem;
    }

    .selected-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.15rem 0.45rem;
      border-radius: 0.25rem;
      background: var(--accent);
      color: #101218;
      font-size: 0.78rem;
      font-weight: 600;
    }

    .selected-tag button {
      background: transparent;
      border: none;
      padding: 0;
      margin: 0;
      color: inherit;
      font-size: 0.9rem;
      line-height: 1;
      cursor: pointer;
    }

    .checkbox-label {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      color: var(--text);
      font-size: 0.9rem;
      cursor: pointer;
      margin-top: 1.35rem;
    }

    input[type="checkbox"] {
      accent-color: var(--accent);
      width: 1rem;
      height: 1rem;
      cursor: pointer;
    }

    input[type="search"], button {
      padding: 0.45rem 0.7rem;
      border-radius: 0.4rem;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.9rem;
    }

    button {
      cursor: pointer;
      background: #2b2f38;
      transition: background 0.15s, border-color 0.15s;
    }

    button:hover { background: #363b46; border-color: #4a5060; }

    main { padding: 1rem; }

    #mints-table { margin-top: 0.75rem; }

    .tabulator { border: 1px solid var(--border); border-radius: 0.4rem; background: var(--bg); }

    .tabulator .tabulator-header {
      background: var(--header-bg);
      color: var(--header-text);
      border-color: var(--border);
      font-weight: 700;
    }

    .tabulator .tabulator-header .tabulator-col { border-color: #b8beca; }
    .tabulator .tabulator-header .tabulator-col-content { padding: 0.65rem 0.5rem; }

    .tabulator .tabulator-header .tabulator-arrow {
      border-bottom-color: var(--header-text);
    }

    .tabulator .tabulator-tableholder .tabulator-table {
      background: var(--bg);
      color: var(--text);
    }

    .tabulator-row { border-color: var(--border); }
    .tabulator-row.tabulator-row-even { background: var(--even-row); }
    .tabulator-row.tabulator-row-odd { background: var(--odd-row); }
    .tabulator-row:hover { background: var(--hover-bg); }

    .tabulator-cell {
      padding: 0.5rem;
      border-color: var(--border);
    }

    .tabulator-cell a {
      color: var(--link);
      text-decoration: none;
    }
    .tabulator-cell a:hover { text-decoration: underline; }

    .tabulator .tabulator-footer {
      background: var(--panel);
      border-color: var(--border);
      color: var(--text);
    }

    .tabulator .tabulator-footer .tabulator-page {
      color: var(--text);
      background: var(--surface);
      border-color: var(--border);
    }

    .tabulator .tabulator-footer .tabulator-page.active {
      color: var(--header-text);
      background: var(--header-bg);
      border-color: var(--header-bg);
    }

    .tabulator .tabulator-footer .tabulator-page:not(.disabled):hover {
      background: var(--hover-bg);
    }

    .unit-badge {
      display: inline-block;
      padding: 0.15rem 0.4rem;
      border-radius: 0.25rem;
      background: #2b2f38;
      border: 1px solid var(--border);
      font-size: 0.75rem;
      margin-right: 0.25rem;
      white-space: nowrap;
    }

    .mint-logo {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
    }

    .disabled-method {
      text-decoration: line-through;
      opacity: 0.6;
    }

    .disabled-badge {
      background: #5c2b2b;
      color: #ff9e9e;
      border-color: #8a3b3b;
    }

    footer {
      padding: 1rem;
      color: var(--muted);
      font-size: 0.8rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1><span class="logo"></span> Cashu Mint Directory</h1>
      <p class="subtitle">Live-ish list of Cashu mints with info pulled from each mint’s <code>/v1/info</code> endpoint.</p>
    </div>
    <div class="toolbar">
      <input id="search" type="search" placeholder="Search mints..." />
      <button id="dl-csv">Download CSV</button>
      <button id="dl-json">Download JSON</button>
    </div>
  </header>

  <main>
    <div class="filters">
      <div class="filter-group">
        <label>Supported NUTs</label>
        <div class="multi-select" id="ms-nuts">
          <button class="multi-select-trigger" type="button">Select NUTs…</button>
          <div class="multi-select-dropdown"></div>
          <div class="selected-tags"></div>
        </div>
      </div>
      <div class="filter-group">
        <label>Units</label>
        <div class="multi-select" id="ms-units">
          <button class="multi-select-trigger" type="button">Select units…</button>
          <div class="multi-select-dropdown"></div>
          <div class="selected-tags"></div>
        </div>
      </div>
      <div class="filter-group">
        <label class="checkbox-label">
          <input id="include-stale" type="checkbox" />
          Include stale / offline mints
        </label>
      </div>
    </div>
    <div id="mints-table"></div>
  </main>

  <footer>
    Data sourced from <code>awesome-cashu</code>, MintRadar, and direct <code>/v1/info</code> requests.
  </footer>

  <script>
    function semverSorter(a, b) {
      const va = (a || "").replace(/^[^0-9]*/, "").replace(/-.*/, "").split(".").map(n => parseInt(n, 10) || 0);
      const vb = (b || "").replace(/^[^0-9]*/, "").replace(/-.*/, "").split(".").map(n => parseInt(n, 10) || 0);
      for (let i = 0; i < Math.max(va.length, vb.length); i++) {
        const na = va[i] || 0, nb = vb[i] || 0;
        if (na !== nb) return na - nb;
      }
      return String(a).localeCompare(String(b));
    }

    function linkFormatter(cell) {
      const value = cell.getValue();
      if (!value) return "";
      return `<a href="${value}" target="_blank" rel="noopener">${value}</a>`;
    }

    function monoFormatter(cell) {
      const value = cell.getValue();
      if (!value) return "";
      return `<code>${value}</code>`;
    }

    function escapeHtml(str) {
      return String(str ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch]));
    }

    function logoFormatter(cell) {
      const row = cell.getRow().getData();
      const url = cell.getValue() || "cashu_liquid.jpg";
      const tooltip = escapeHtml(row.description || "");
      return `<img class="mint-logo" src="${escapeHtml(url)}" alt="" title="${tooltip}" onerror="this.src='cashu_liquid.jpg'; this.onerror=null;">`;
    }

    function nameFormatter(cell) {
      const row = cell.getRow().getData();
      const name = escapeHtml(cell.getValue());
      const tooltip = escapeHtml(row.description_long || row.description || "");
      return `<span title="${tooltip}">${name}</span>`;
    }

    function scoreFormatter(cell) {
      const value = cell.getValue();
      if (value === "" || value == null) return "";
      const color = value >= 80 ? "#4ade80" : value >= 50 ? "#facc15" : "#f87171";
      return `<span style="color:${color};font-weight:600">${value}</span>`;
    }

    function badgeFormatter(cell) {
      const value = cell.getValue();
      if (!value) return "";
      return value.split(",").map(v => `<span class="unit-badge">${v.trim()}</span>`).join(" ");
    }

    function methodListFormatter(cell, formatterParams) {
      const row = cell.getRow().getData();
      const value = cell.getValue();
      const disabled = formatterParams && formatterParams.disabledField && row[formatterParams.disabledField];
      if (!value) {
        return disabled ? '<span class="unit-badge disabled-badge">disabled</span>' : "";
      }
      const badgeClass = disabled ? "unit-badge disabled-method" : "unit-badge";
      let badges = value.split(",").map(v => `<span class="${badgeClass}">${escapeHtml(v.trim())}</span>`).join(" ");
      if (disabled) {
        badges += ' <span class="unit-badge disabled-badge">disabled</span>';
      }
      return badges;
    }

    function buildNutsFilter(values) {
      return values.length === 0
        ? null
        : (rowData) => values.every(n => (rowData.nuts || []).includes(Number(n)));
    }

    function buildUnitsFilter(values) {
      return values.length === 0
        ? null
        : (rowData) => values.every(u => (rowData.units || []).includes(u));
    }

    function staleFilter(rowData) {
      const includeStale = document.getElementById("include-stale").checked;
      if (includeStale) return true;
      return rowData.status === "online";
    }

    function populateSelect(id, values) {
      const select = document.getElementById(id);
      select.innerHTML = "";
      values.forEach(v => {
        const opt = document.createElement("option");
        opt.value = v;
        opt.textContent = v;
        select.appendChild(opt);
      });
    }

    function getSelectedValues(id) {
      return Array.from(document.getElementById(id).selectedOptions).map(o => o.value);
    }

    function createMultiSelect(containerId, options, onChange) {
      const container = document.getElementById(containerId);
      const trigger = container.querySelector(".multi-select-trigger");
      const dropdown = container.querySelector(".multi-select-dropdown");
      const tagsArea = container.querySelector(".selected-tags");
      const selected = new Set();

      function renderTags() {
        tagsArea.innerHTML = "";
        selected.forEach(value => {
          const tag = document.createElement("span");
          tag.className = "selected-tag";
          tag.innerHTML = `${value} <button type="button" aria-label="Remove ${value}">×</button>`;
          tag.querySelector("button").addEventListener("click", (e) => {
            e.stopPropagation();
            selected.delete(value);
            container.querySelector(`input[value="${CSS.escape(value)}"]`).checked = false;
            renderTags();
            onChange(Array.from(selected));
          });
          tagsArea.appendChild(tag);
        });
      }

      options.forEach(value => {
        const label = document.createElement("label");
        label.className = "multi-select-option";
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.value = value;
        checkbox.addEventListener("change", () => {
          if (checkbox.checked) selected.add(value);
          else selected.delete(value);
          renderTags();
          onChange(Array.from(selected));
        });
        label.appendChild(checkbox);
        label.appendChild(document.createTextNode(value));
        dropdown.appendChild(label);
      });

      trigger.addEventListener("click", (e) => {
        e.stopPropagation();
        // Close other dropdowns.
        document.querySelectorAll(".multi-select.open").forEach(el => {
          if (el !== container) el.classList.remove("open");
        });
        container.classList.toggle("open");
      });

      // Close dropdown when clicking outside.
      document.addEventListener("click", (e) => {
        if (!container.contains(e.target)) container.classList.remove("open");
      });

      return {
        getValues: () => Array.from(selected),
        setValues: (values) => {
          selected.clear();
          values.forEach(v => selected.add(v));
          container.querySelectorAll("input[type='checkbox']").forEach(cb => {
            cb.checked = selected.has(cb.value);
          });
          renderTags();
        }
      };
    }

    function applyFilters(table, searchValue, nutsSelect, unitsSelect) {
      const filters = [staleFilter];
      const nutFilter = buildNutsFilter(nutsSelect.getValues());
      const unitFilter = buildUnitsFilter(unitsSelect.getValues());
      if (nutFilter) filters.push(nutFilter);
      if (unitFilter) filters.push(unitFilter);

      if (searchValue && searchValue.trim() !== "") {
        const term = searchValue.trim().toLowerCase();
        filters.push(row =>
          (row.name || "").toLowerCase().includes(term) ||
          (row.url || "").toLowerCase().includes(term) ||
          (row.implementation || "").toLowerCase().includes(term)
        );
      }

      table.setFilter(filters);
    }

    fetch("mints.json?v=3")
      .then(r => r.json())
      .then(data => {
        // Collect all optional NUTs and units for filter dropdowns.
        const allNuts = Array.from(new Set(data.flatMap(m => m.nuts || []))).sort((a, b) => a - b);
        const allUnits = Array.from(new Set(data.flatMap(m => m.units || []))).sort();

        const table = new Tabulator("#mints-table", {
          data: data,
          layout: "fitColumns",
          responsiveLayout: "hide",
          resizableColumns: true,
          movableColumns: true,
          pagination: true,
          paginationSize: 100,
          paginationSizeSelector: [25, 50, 100, true],
          initialSort: [
            { column: "stale_score", dir: "desc" },
            { column: "implementation", dir: "asc" },
            { column: "version", dir: "desc" }
          ],
          columns: [
            { title: "", field: "icon_url", formatter: logoFormatter, headerSort: false, hozAlign: "center", width: 50 },
            { title: "Name", field: "name", formatter: nameFormatter, sorter: "string", widthGrow: 1.5 },
            { title: "URL", field: "url", formatter: linkFormatter, sorter: "string", widthGrow: 2 },
            { title: "Implementation", field: "implementation", sorter: "string" },
            { title: "Version", field: "version", sorter: semverSorter },
            { title: "NUTs", field: "nuts_display", sorter: "string", widthGrow: 1 },
            { title: "Units", field: "units_display", formatter: badgeFormatter, sorter: "string", widthGrow: 0.8 },
            { title: "Mint methods", field: "mint_methods_display", formatter: methodListFormatter, formatterParams: { disabledField: "nut4_disabled" }, sorter: "string", widthGrow: 1 },
            { title: "Melt methods", field: "melt_methods_display", formatter: methodListFormatter, formatterParams: { disabledField: "nut5_disabled" }, sorter: "string", widthGrow: 1 },
            { title: "Freshness", field: "stale_score", formatter: scoreFormatter, sorter: "number", hozAlign: "center", width: 90 },
            { title: "Status", field: "status", sorter: "string", hozAlign: "center", width: 90 },
            { title: "Email", field: "email", sorter: "string", widthGrow: 1 },
            { title: "X / Twitter", field: "x", sorter: "string", widthGrow: 0.8 },
            { title: "Nostr", field: "nostr", formatter: monoFormatter, sorter: "string", widthGrow: 1.2 },
            { title: "Other Contact", field: "other_contact", sorter: "string", widthGrow: 1 }
          ]
        });

        const nutsSelect = createMultiSelect("ms-nuts", allNuts.map(String), () => {
          applyFilters(table, document.getElementById("search").value, nutsSelect, unitsSelect);
        });
        const unitsSelect = createMultiSelect("ms-units", allUnits, () => {
          applyFilters(table, document.getElementById("search").value, nutsSelect, unitsSelect);
        });

        document.getElementById("search").addEventListener("input", function(e) {
          applyFilters(table, e.target.value, nutsSelect, unitsSelect);
        });

        document.getElementById("include-stale").addEventListener("change", function() {
          applyFilters(table, document.getElementById("search").value, nutsSelect, unitsSelect);
        });

        // Default: hide stale/offline mints.
        applyFilters(table, "", nutsSelect, unitsSelect);

        document.getElementById("dl-csv").addEventListener("click", () => table.download("csv", "cashu-mints.csv"));
        document.getElementById("dl-json").addEventListener("click", () => table.download("json", "cashu-mints.json"));
      })
      .catch(err => {
        document.getElementById("mints-table").innerHTML = `<p style="color:#ff6b6b">Failed to load mint data: ${err.message}</p>`;
      });
  </script>
</body>
</html>
